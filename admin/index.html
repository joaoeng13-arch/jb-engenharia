<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#090909">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <title>Administração de conteúdos | JB Engenharia</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f6f6f6;color:#151515;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
    .adminbar{height:64px;display:flex;align-items:center;justify-content:space-between;background:#0b0b0b;border-bottom:1px solid #383838;padding:0 max(20px,calc((100vw - 1200px)/2));gap:15px}
    .adminbar a{display:inline-flex;align-items:center;color:#fff;gap:10px;text-decoration:none;font-size:12px;font-weight:720}
    .adminbar img{height:40px;width:125px;object-fit:contain;object-position:left}
    .adminbar small{color:#c3c3c3;font-size:11px}
    @media(max-width:500px){.adminbar{padding:0 14px}.adminbar img{width:100px}.adminbar small{display:none}}
  </style>
</head>
<body>
  <div class="adminbar"><a href="/" title="Voltar ao site"><img src="/assets/logo-jb-branca.png" alt="JB Engenharia"><span>← Voltar ao site</span></a><small>Painel de conteúdos · GitHub / Cloudflare</small></div>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
